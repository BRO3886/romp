name: Experimental v2

on:
  push:
    branches: [v2, codex/experimental-v2]
    paths: [v2/**, .github/workflows/v2.yml]
  pull_request:
    paths: [v2/**, .github/workflows/v2.yml]

jobs:
  vault:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y dbus gnome-keyring
      - name: Test the native Secret Service vault
        env:
          ROMP_TEST_NATIVE_VAULT: '1'
        run: |
          dbus-run-session -- bash -e -c '
            printf "%s" "romp-disposable-test-keyring" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            node --import tsx --test test/vault.test.ts
            cd cloud
            node --import tsx --test --test-name-pattern="native credential vault" test/setup.node.ts
          '
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev

  cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run cloud:check
      - run: npm run types --workspace @romp/cloud -- --check
      - run: npm run cloud:test
      - run: npm run test:preflight --workspace @romp/cloud
      - run: npm run build
      - run: npm run test:setup --workspace @romp/cloud
      - run: npm run test:container --workspace @romp/cloud
      - run: npm run bundle --workspace @romp/cloud
      - run: npm audit --omit=dev
